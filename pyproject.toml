[project]
name = "hackbench"
version = "0.2.0"
description = "Science agents doing Polaron's battery-electrode QC, and the evals that tell you when to trust them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[project.optional-dependencies]
deploy = ["modal>=1.0"]
qc = [
    "imagecodecs>=2026.8.16",
    "numpy>=2.5.3",
    "scikit-image>=0.26.0",
    "tifffile>=2026.9.20",
]
agents = [
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, B bugbear, UP pyupgrade, S bandit security,
# ANN annotations, N naming, SIM simplify, C4 comprehensions, PT pytest, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "S", "ANN", "N", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
# Reason: scikit-image ships without type hints; exempt calls into it, keep our code strict.
untyped_calls_exclude = ["skimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
