name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Install (lockfile must match pyproject)
        run: uv sync --all-extras --frozen
      - name: Lint (incl. security rules), strict typecheck, tests
        run: make validate
      - name: Dependency vulnerability audit
        run: make audit

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No private data, raw TIFFs or .env tracked
        run: |
          if git ls-files | grep -E '^private/|\.tiff?$|(^|/)\.env$'; then
            echo "::error::private data, TIFFs or .env are tracked"; exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on findings in PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
