name: Deploy

# Deploy to Modal after CI passes on main, then run the e2e tests against the live URL.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Reason: only a successful CI run from a *push* in *this* repo may deploy. workflow_run also
    # fires for fork PRs (whose branch may be named main); never check those out with secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HACKBENCH_E2E_URL: ${{ vars.HACKBENCH_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reason: deploy exactly the commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --all-extras --frozen
      - name: Deploy to Modal
        run: make deploy
      - name: End-to-end tests against the live deploy
        run: make e2e
